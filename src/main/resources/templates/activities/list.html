
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>동아리 활동 목록</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>동아리 활동 관리</h2>
        <a th:href="@{/activities/new}" class="btn btn-primary">
            신규 활동 등록
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>활동명</th>
                <th>동아리명</th>
                <th>카테고리</th>
                <th>날짜</th>
                <th>장소</th>
                <th>참여 인원</th>
                <th>설명</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="activity : ${activities}">
                <td th:text="${activity.id}"></td>
                <td th:text="${activity.title}"></td>
                <td th:text="${activity.clubName}"></td>
                <td th:text="${activity.category}"></td>
                <td th:text="${activity.activityDate}"></td>
                <td th:text="${activity.location}"></td>
                <td th:text="${activity.participants}"></td>
                <td th:text="${activity.description}"></td>
            </tr>

            <tr th:if="${#lists.isEmpty(activities)}">
                <td colspan="8" class="text-center">
                    등록된 활동이 없습니다.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
