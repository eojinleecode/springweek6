
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>동아리 활동 등록</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5" style="max-width: 800px;">

    <h2 class="mb-4">새로운 동아리 활동 등록</h2>

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <form th:action="@{/activities}" method="post">

                <div class="mb-3">
                    <label for="title" class="form-label">활동명</label>
                    <input type="text" id="title" name="title"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="clubName" class="form-label">동아리명</label>
                    <input type="text" id="clubName" name="clubName"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="category" class="form-label">카테고리</label>
                    <input type="text" id="category" name="category"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="activityDate" class="form-label">활동 날짜</label>
                    <input type="date" id="activityDate" name="activityDate"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="location" class="form-label">장소</label>
                    <input type="text" id="location" name="location"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="participants" class="form-label">참여 인원</label>
                    <input type="number" id="participants" name="participants"
                           class="form-control" min="1" required>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">활동 설명</label>
                    <textarea id="description" name="description"
                              class="form-control" rows="4" required></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        활동 등록
                    </button>

                    <a th:href="@{/activities}" class="btn btn-secondary">
                        목록으로 돌아가기
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
